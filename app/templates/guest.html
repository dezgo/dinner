{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block bodyattrs %}data-token="{{ token }}" class="no-tabs"{% endblock %}
{% block body %}
<header class="topbar"><div class="wrap row" style="flex-wrap:nowrap">
  <div class="title grow" id="title">{{ title }}</div>
  <a id="orgback" class="btn small" href="/o" style="flex:none;white-space:nowrap" hidden>← Organiser</a>
  <span id="conn" class="conn hidden" aria-live="polite"></span>
  <span id="prefs" class="row" style="gap:.3rem"></span>
</div></header>
<main id="app"><div class="wrap"><p class="muted" style="padding-top:2rem">Loading…</p></div></main>
<nav id="tabs" class="tabs" role="tablist" aria-label="Sections"></nav>
<script type="module" src="/static/js/guest.js?v={{ version }}"></script>
{% endblock %}
