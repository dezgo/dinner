# Dinner Tab. HTTP only at first — `sudo certbot --nginx -d dinner.appfoundry.cc`
# adds the HTTPS block. No basic auth: guests must reach /d/... freely; the app
# protects organiser pages itself and verifies Up's webhook signatures.
server {
    listen 80;
    listen [::]:80;
    server_name dinner.appfoundry.cc;

    # Menu and receipt photos, a few at a time.
    client_max_body_size 60m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Live updates (Server-Sent Events): no buffering, long-lived.
    location ~ ^/api/(d/[^/]+|o)/events$ {
        proxy_pass http://127.0.0.1:8030;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    location / {
        proxy_pass http://127.0.0.1:8030;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~ /\. {
        deny all;
    }
}
